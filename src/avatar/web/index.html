<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar semne</title>
<style>
  :root { --bg: #eef1f5; --panel: #ffffff; --text: #1d2430; --muted: #5b6575; --accent: #2f6fde; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px;
         align-items: center; background: var(--panel); padding: 8px 12px; border-radius: 10px;
         box-shadow: 0 2px 10px rgba(0,0,0,.08); font-size: 15px; }
  #bar select, #bar button { font: inherit; padding: 4px 8px; }
  #bar button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #status { color: var(--muted); margin-left: auto; font-size: 13px; }
  #subtitle { position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 30px;
              font-weight: 600; text-shadow: 0 1px 0 #fff; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "@pixiv/three-vrm": "./vendor/three-vrm/three-vrm.module.js"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="bar">
  <button id="prev" title="Semnul anterior (săgeată stânga sau P)">◀ Anterior</button>
  <label>Semn <select id="word"></select></label>
  <button id="next" title="Semnul următor (săgeată dreapta sau N)">Următor ▶</button>
  <button id="play" title="Redă din nou (spațiu)">Redă</button>
  <label><input type="checkbox" id="loop"> în buclă</label>
  <label title="Scheletul MediaPipe al înregistrării, lângă avatar (albastru = mâna stângă a semnatarului, portocaliu = dreapta)"><input type="checkbox" id="points"> puncte</label>
  <label>Viteză <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
  <span id="status">Se încarcă…</span>
</div>
<div id="subtitle"></div>
<script type="module" src="./avatar.js"></script>
</body>
</html>
